# P1-D (S-M3): her gece ekran çekimleri (ekran.spec, tasarım boyutunda 2x) ve tam e2e. Çekimler 14 gün artefakt olarak kalır;
# tasarım PNG'leri depoda olmadığından karşılaştırma (npm run karsilastir) yerelde yapılır.
name: Gece
on:
  schedule: [{ cron: '30 1 * * *' }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  ekran:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tam e2e (ekran çekimleri dahil)
        run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ekran-cekimleri, path: 'karsilastirma/uygulama/', retention-days: 14 }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-rapor, path: 'playwright-report/', retention-days: 7 }
