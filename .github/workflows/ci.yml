name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  denetim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Token'lar güncel mi
        run: npm run tokens && git diff --exit-code src/stil/tokens.css src/stil/tokens.ts
      - name: Geometri testi (galaksi-geometri --test)
        run: npm run geometri:test
      - name: Sunucu testleri (sahte API'nin dayandığı gerçek sunucu kodu; P0-C yetki matrisi dahil)
        run: npm run sunucu:test
      - name: Birim testleri (yol uzunluğu, kaynakla eşdeğerlik)
        run: npm test
      - name: Tür denetimi ve derleme
        run: npm run build
      - name: Sır taraması (S-B1)
        run: node scripts/sir-tarama.mjs
  e2e:
    # P1-D (S-M3): tarayıcı testleri sahte kipte (gerçek sunucu kodu tarayıcıda). Ekran çekimleri (ekran.spec) gece işinde.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: e2e (360–1440 px, ekran çekimleri hariç)
        run: npx playwright test $(ls e2e/*.spec.ts | grep -v ekran.spec)
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-rapor, path: 'playwright-report/', retention-days: 7 }
  sql:
    # P0-C (S-M1, N-6): migration'lar boş Postgres'e sırayla uygulanır, sonra yetki ve bütünlük SQL testleri
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, LANG: en_US.utf8 }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Migration'lar ve SQL testleri
        run: scripts/sql-test.sh
