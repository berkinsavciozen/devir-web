# İkinci yayın adresi: https://berkinsavciozen.github.io/devir-web/ (workers.dev'e erişilemeyen ağlar için).
# Depo ayarlarında Pages > Source: "GitHub Actions" seçili olmalı.
name: GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  yayin:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.dagit.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: dagit
        uses: actions/deploy-pages@v4
