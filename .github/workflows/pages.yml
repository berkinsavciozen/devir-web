# İkinci yayın adresi: https://berkinsavciozen.github.io/devir-web/ (workers.dev'e erişilemeyen ağlar için).
# Depo ayarlarında Pages > Source: "GitHub Actions" seçili olmalı.
# P0-C deploy kapısı: ana dalda CI (denetim + sql) yeşil bitmeden yayın yapılmaz.
name: GitHub Pages
on:
  workflow_run: { workflows: [CI], types: [completed], branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  yayin:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.dagit.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.workflow_run.head_sha || github.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: dagit
        uses: actions/deploy-pages@v4
